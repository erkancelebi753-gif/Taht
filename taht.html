<title>Taht - Krallık Yönetimi</title>

<style>
:root{--bg:#070d14;--card:#0e1824;--ink:#e6edf4;--mute:#8497aa;--line:#233649;--k:#c9a227;--good:#4ade80;--bad:#f0524f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:900px;margin:0 auto;padding:0 10px 130px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:rgba(7,13,20,.96);padding:8px 0 6px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:19px;font-weight:800}h3{margin:16px 0 8px;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.hd{display:flex;align-items:center;gap:10px}.hd p,.m{margin:2px 0 0;color:var(--mute);font-size:13px}
.fl{border-radius:3px;box-shadow:0 0 0 1px #3a5068;flex:none;margin-right:6px;vertical-align:middle}.hd .fl{margin:0}
.rs{display:flex;flex:1;gap:14px;font-weight:700}.dt{text-align:right;font-weight:700;font-size:13px}
.ttl{text-align:center;margin:12px 0 8px}.ttl b{font-size:20px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.g4 .b{padding:9px 2px;text-align:center}
.s,.r,.kc{background:var(--card);border:1px solid var(--line);border-radius:6px}
.s{padding:9px 11px}.s b{font-size:16px}small{display:block;color:var(--mute);font-size:12px;font-weight:400}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 11px;margin-bottom:7px}
.kc{display:block;width:100%;text-align:left;padding:11px;margin-bottom:7px;font:inherit;color:var(--ink);cursor:pointer}
.sel{border-color:var(--k)}
.bar{height:5px;background:#1b2b3c;border-radius:3px;margin-top:4px}.bar i{display:block;height:100%;border-radius:3px;background:var(--good)}.bar.lo i{background:var(--bad)}
.b{font:inherit;font-size:13px;font-weight:600;background:#13202f;color:var(--ink);border:1px solid #2b4259;border-radius:6px;padding:8px 12px;cursor:pointer;text-align:left}
.b:disabled{opacity:.4;cursor:default}.b.on{border-color:var(--k);background:#192c40;box-shadow:inset 0 -2px 0 var(--k)}
button:focus-visible{outline:2px solid var(--k);outline-offset:2px}
.tabs,.mn{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.tabs .b,.mn .b{flex:none}.mn{margin:8px 0 0}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:4;background:rgba(7,13,20,.97);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:stretch}
.nw{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;cursor:pointer}
.nw p{margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nx{display:flex;flex-direction:column;gap:6px;width:40%;max-width:190px}.nx .b{text-align:center}
.go{background:var(--ink);color:var(--bg);font:inherit;font-weight:800;padding:8px;border:0;border-radius:6px;cursor:pointer}.go small{color:#3b4a5a}
.nl{position:fixed;left:10px;right:10px;bottom:calc(86px + env(safe-area-inset-bottom,0px));max-height:45vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;z-index:4}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;z-index:6;overflow:auto}
.card{background:var(--card);width:100%;max-width:640px;border-radius:10px 10px 0 0;border-top:4px solid var(--k);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.card .b{display:block;width:100%;margin-top:8px;padding:12px}
.stg{position:absolute;left:0;top:0;width:566px;height:353px;transform-origin:0 0;background:#08141d}

const armHere=g=>S.arm.filter(a=>a.at==g).map(a=>`<div class=r><div><b>${a.n}</b><small>${unl(a.u)}${a.sg?', kuşatıyor':''}</small></div><div style="display:flex;gap:6px"><button class=b onclick="sel(${a.id})">${a.id==S.sa?'Seçili':'Seç'}</button>${S.cities.some(c=>c.g==g)&&!a.sg?`<button class=b onclick="garr(${a.id})">Garnizona katıl</button>`:''}</div></div>`).join('');
const ecoLB=()=>{const me=S.cities.reduce((s,c)=>s+ecoO(c),0),L=[{n:KD[S.kk].n,k:KD[S.kk],e:me,me:1},...S.N.filter(x=>x.cities).map(x=>({n:nm(x),k:KD[x.i],e:neco(x)}))].sort((a,b)=>b.e-a.e),ix=L.findIndex(o=>o.me);return '<h3>EKONOMİ SIRALAMASI</h3>'+L.slice(0,8).map((o,i)=>`<div class=r style="${o.me?'border-color:var(--k)':''}"><div>${i+1}. ${fl(o.k,22)}${o.n}</div><b>${f1(o.e)}</b></div>`).join('')+(ix>7?`<small>Senin sıran: ${ix+1}. (${f1(me)})</small>`:'')+'<h3>DEVLETLER</h3>'};
function sheetHtml(){const g=S.pc,c=S.ct&&S.ct[g];
 if(g<0||g===undefined)return `<div class=s><b>Eyalet seç</b><small>Haritada bir eyaletin sınırları içine dokun.</small></div>`;
 const ah=armHere(g),ahh=ah?'<h3>BURADAKİ ORDULAR</h3>'+ah:'';
 if(!c)return `<div class=s><b>Vahşi topraklar</b><small>Burada kimse yerleşmemiş.</small></div>${ahh}`+selBox(g);
 const j=S.ow[g],x=j>=0?S.N[j]:null,k=KD[x?x.i:S.kk];
 let h=`<div class=s><div class=hd>${fl(k,32)}<div><b>${IC[c.t]} ${c.n}</b><small>${k.n}, ${c.t}, savunma ${f1(dv(c))}, inanç ${R[c.r][0]}</small></div></div><small style="margin-top:6px">Ekonomi: ${x?'~'+f1(ecoA(c))+' altın/tur, ülke toplamı ~'+f1(neco(x)):f1(ecoO(c))+' altın/tur'}</small>`;
 if(!x){h+=`<small>Garnizon: ${unl(c.a)}. Huzursuzluk %${Math.round(c.u)}${c.r!=S.rel?', farklı inanç':''}</small>${c.r!=S.rel?`<button class=b style="margin-top:6px" onclick="conv()" ${S.gold<30?'disabled':''}>Devlet dinine döndür (30)</button>`:''}</div>`;
  h+='<h3>İNŞA ET</h3><div class=g2>'+BN.map(([b,n,d])=>{const l=c.b[b],co=40*(l+1);return `<button class=b onclick="bld('${b}')" ${l>=3||S.gold<co?'disabled':''}>${n||R[S.rel][1]} ${l}/3<small>${d}, ${l>=3?'tam':co+' altın'}</small></button>`}).join('')+'</div>';
  h+='<h3>ASKER OLUŞTUR (garnizona eklenir)</h3><div class=g2>'+Object.keys(U).map(u=>{const o=U[u],lk=(o.req&&!S.tech[o.req])||c.b.k<KT2[u];return `<button class=b onclick="rec('${u}',1)" ${lk||S.gold<o.c||S.pop<6?'disabled':''}>${un(u)} +1<small>${o.c} altın, güç ${pw(u)}${c.b.k<KT2[u]?', Kışla '+KT2[u]+' gerekli':o.req&&!S.tech[o.req]?', teknoloji gerekli':''}</small></button>`}).join('')+'</div>';
  h+=`<h3>ORDU KUR</h3><div class=g2><button class=b onclick="mkArmy(.5)" ${anu(c.a)?'':'disabled'}>Garnizonun yarısı</button><button class=b onclick="mkArmy(1)" ${anu(c.a)?'':'disabled'}>Garnizonun tamamı</button></div>`+ahh+selBox(g)}
 else{h+=`<small>${x.w?'Savaştasınız':'Barıştasınız'}, ilişki ${Math.round(x.rel)}, ikmal mesafesi ${dist(g)}</small></div>`+ahh+selBox(g)+`<button class=b style="margin-top:8px" onclick="S.sel=${j};tab='dip';render()">Diplomasi</button>`}
 return h}
function render(){
 ROT=LAND&&innerHeight>innerWidth;
 const y=scrollY,A=$('#app');A.className=(ROT?'rot ':'')+(VW()>VH()?'ls':'');
 if(!S){A.innerHTML=`<div class=w><div class=top><h1>Taht</h1><p class=m>Bir krallık seç. Oyun sonsuz, her tur 10 gün.</p></div><div class=s style="margin:6px 0 12px"><b>Büyük Kış sonrası</b><small style="font-size:13px;line-height:1.5">Büyük Kış bozkırları ve vadileri yedi yıl karanlığa gömdü. Kabileler hayatta kalmak için göç etti, kurganların ve kalelerin çevresinde yeni krallıklar doğdu. Şimdi bozkır kağanları, taht krallıkları, doğu hanedanları ve güney şahlıkları Cardonia kıtasını paylaşıyor: Fara, Essear, Belros, Theanas, Elonia, Cyrin ve Dravina. Hangi bayrak çağlar boyunca ayakta kalacak?</small></div>${KD.map((k,i)=>`<button class=kc onclick="start(${i})"><div class=hd>${fl(k,40)}<div><b>${k.n}</b><small>${reg(i)}, ${R[k.rel][0]}, ${AR[k.ar][0]}: ${AR[k.ar][1]}</small></div></div></button>`).join('')}</div>`;return}
 const net=gain()-cost(),fn=foodNet(),mt=(e,n,v)=>`<div><small>${e} ${n} ${Math.round(v)}</small><div class="bar ${v<30?'lo':''}"><i style="width:${v}%"></i></div></div>`;
 const mtr=`<div class=g3>${mt('😊','Mutluluk',S.hap)}${mt('⚖️','İstikrar',S.stab)}${mt('🙏','İnanç',S.faith)}</div>`;
 if(!S.v){const W=VW(),H=VH(),k0=Math.min(Math.max(W/566,H/353),Math.min(W/566,H/353)*1.8);S.v={k:k0,x:(W-566*k0)/2,y:(H-353*k0)/2}}
 const dock=tab?`<div class=dk><div class=dh><b>${PT[tab]}</b><button class=b onclick="tab='';render()">✕</button></div>${tabHtml()}</div>`:S.pc>=0?`<div class=dk><div class=dh><b>Eyalet</b><button class=b onclick="S.pc=-1;render()">✕</button></div>${sheetHtml()}</div>`:'';
 let h=`<div class=vp onpointerdown="pd(event)" onpointermove="pm(event)" onpointerup="pu(event)" onpointercancel="pu(event)" onwheel="whl(event)"><div class=stg id=stg style="transform:translate(${S.v.x}px,${S.v.y}px) scale(${S.v.k})">${S.cities.length?mapHtml():''}</div></div>
 <div class=hud><div class=hd>${fl(KD[S.kk],40)}<div class=rs><div>💰 ${f1(S.gold)}<small>${net>=0?'+':''}${f1(net)}/tur</small></div><div>👥 ${f1(S.pop)}k<small>${S.cities.length} şehir</small></div><div>🌾 ${f1(S.food)}<small>${fn>=0?'+':''}${f1(fn)}/tur</small></div></div><div class=dt>Gün ${S.day}<small>${ERA[S.era].replace(' Çağı','')}, ${R[S.rel][0]}</small></div></div>
 ${mtr}<div class=mn><button class="b ${LAND?'on':''}" onclick="LAND=!LAND;render()">⟳ Yatay</button><button class=b onclick="S.mm=(S.mm+1)%4;render()">🎨 ${['Siyasi','Din','Huzursuzluk','Ekonomi'][S.mm]}</button>${[['saray','Saray'],['sehir','Şehirler'],['dip','Diplomasi'],['din','Din'],['bilim','Bilim']].map(t=>`<button class="b ${tab==t[0]?'on':''}" onclick="tab=tab=='${t[0]}'?'':'${t[0]}';render()">${t[1]}</button>`).join('')}</div></div>
 ${dock}
 <div class=fb><div class=nw onclick="S.lgx=!S.lgx;render()"><p>${S.log[0]}</p><small>${S.lgx?'Kapat':'Tüm haberler'}</small></div><div class=nx><button class="b ${tab=='ordu'?'on':''}" onclick="tab='ordu';render()">⚔️ Ordu</button><button class=go onclick="endTurn()">Sonraki Tur<small>Gün ${S.day}</small></button></div></div>${S.lgx?`<div class=nl>${S.log.slice(0,14).map((l,i)=>`<p style="margin:0 0 6px;font-size:13px;${i?'color:var(--mute)':'font-weight:600'}">${l}</p>`).join('')}</div>`:''}`;
 if(S.ev){const e=S.ev;h+=`<div class=ov><div class=card><h1>${e.t}</h1><p>${e.d}</p>${e.ch.map((c,i)=>`<button class=b onclick="pick(${i})" ${S.gold<(c[2]||0)?'disabled':''}>${c[0]}</button>`).join('')}</div></div>`}
 if(S.over)h+=`<div class=ov><div class=card><h1>Tahtını kaybettin</h1><p>${S.msg}</p><p><b>Skor: ${S.score}</b>, ${S.day} gün hüküm sürdün.</p><button class=b onclick="S=null;render()">Yeni oyun</button></div></div>`;
 const ds=$('.dk'),key=tab||'p'+S.pc,sc=S.dkk===key&&ds?ds.scrollTop:0;if(S.cities.length)S.dkk=key;A.innerHTML=h;{const d2=$('.dk');if(d2)d2.scrollTop=sc}if(S.cities.length)paintT();scrollTo(0,y)}
if(typeof addEventListener=='function')addEventListener('resize',()=>render());
render();
